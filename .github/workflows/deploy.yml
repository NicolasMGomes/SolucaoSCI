name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FrontEnd
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FrontEnd/package-lock.json

      - run: npm ci

      - run: npm test -- --watch=false

      - name: Build with the repository base href
        run: npx ng build --base-href "/${{ github.event.repository.name }}/"

      - name: Prepare static hosting fallbacks
        run: |
          cp dist/FrontEnd/browser/index.html dist/FrontEnd/browser/404.html
          touch dist/FrontEnd/browser/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: FrontEnd/dist/FrontEnd/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
